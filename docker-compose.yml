services:
  web:
    build: .
    image: nairobi-powerbikes:latest
    container_name: nairobi-powerbikes
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false   # copy .env.example to .env to set your admin password
    environment:
      DATA_DIR: /data
    volumes:
      - powerbikes-data:/data   # SQLite database + uploaded rider photos live here

volumes:
  powerbikes-data:
